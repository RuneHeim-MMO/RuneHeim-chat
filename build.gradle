import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.zuma'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

build.dependsOn shadowJar

dependencies {
    implementation 'net.openhft:zero-allocation-hashing:0.27ea1'
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    compileOnly files('libs/RuneHeim-core-1.0-SNAPSHOT.jar')
}

tasks {
    tasks.named("shadowJar", ShadowJar).configure {
        archiveFileName.set("${project.name}-${project.version}.jar")
    }
    tasks.register("devBuild", ShadowJar) {
        archiveFileName.set("dev-chat.jar")
        destinationDirectory.set(file("/home/sp/Desktop/RuneHeim/game-server-template/server/plugins"))
        from sourceSets.main.output
        configurations = [project.configurations.runtimeClasspath]
    }
    tasks.jar {
        enabled = false
    }
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
