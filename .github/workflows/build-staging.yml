name: Build & Deploy

on:
  push:
    branches:
      - development

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean and build with Gradle
        run: ./gradlew clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RuneHeim-chat
          path: build/libs/*.jar
  push:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Send HTTP POST to Minecraft Hook
        run: |
          curl --max-time 30 -X POST "http://213.35.143.204:1337/restart?key=${{ secrets.WEB_HOOK_SECRET }}&seconds=3&reason=Chat%20Update&sender=Github_actions"
